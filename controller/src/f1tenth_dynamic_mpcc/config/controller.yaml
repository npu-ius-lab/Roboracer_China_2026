mode: debug

# V1 remains the safe default until V2 passes an untouched final-test bag.
# The versioned wrapper scripts override both this model and the acados cache,
# so switching versions cannot accidentally reuse generated code from another
# residual feature set.
residual_dynamics:
  enabled: true
  model_path: config/residual/residual_markov_v1.yaml
  required_feature_set: markov_v1

# Runtime closed-loop speed planning. The cap is 4 m/s; it is not a fixed
# target. Curvature, steering-rate and longitudinal acceleration constraints
# reduce the reference speed where required.
speed_planning:
  enabled: true
  min_speed_mps: 0.20
  max_speed_mps: 4.0

timing:
  control_rate_hz: 40.0
  horizon_steps: 25
  horizon_dt_s: 0.05
  # The recorded Point-LIO stream is 0.262 s late on average and 0.641 s at
  # p95. Allow compensated debug operation, but reduce command speed when the
  # delay exceeds the short-prediction region.
  odom_timeout_s: 0.75
  max_state_prediction_s: 0.75
  # Deprecated compatibility field. Committed-horizon prediction now uses
  # actuator.speed_dead_time_s exactly once.
  actuation_prediction_s: 0.0
  solver_deadline_s: 0.025

localization_prediction:
  nominal_age_s: 0.12
  warning_age_s: 0.16
  hard_age_s: 0.25
  max_repropagation_s: 0.30
  # PointLIO high-rate mode can emit adjacent point/IMU states a few hundred
  # microseconds out of order. Drop a pose-continuous sample in this narrow
  # window without invalidating an otherwise healthy localization stream.
  benign_reorder_tolerance_s: 0.001
  benign_reorder_position_tolerance_m: 0.05
  benign_reorder_yaw_tolerance_rad: 0.05

# Point-LIO can report small body-frame lateral and yaw velocities while the
# Ackermann vehicle is physically stationary. Keep raw localization unchanged,
# but project the state passed to the controller onto a low-speed kinematic
# manifold. Hysteresis prevents mode chatter around zero speed.
low_speed_state_conditioning:
  enabled: true
  stationary_enter_vx_mps: 0.12
  stationary_exit_vx_mps: 0.20
  stationary_command_max_mps: 0.20
  full_dynamic_vx_mps: 0.45

topics:
  # Point-LIO body is the MID360/IMU origin. This derived odometry shifts the
  # pose/twist backward 0.135 m to the vehicle center used by the controller.
  odom: /localization/vehicle_odom
  wheel_odom: /tianracer/odom
  collision: /tianracer/collision
  # Safe-by-default. This topic is not connected to the TianRacer driver.
  command: /f1tenth_mpcc/debug/ackermann_cmd_stamped
  telemetry: /f1tenth_mpcc/telemetry
  markers: /f1tenth_mpcc/markers
  prediction_markers: /f1tenth_mpcc/prediction

output:
  # Static track markers are latched once. Only the small predicted path is
  # refreshed while driving, keeping RViz work out of the control hot path.
  prediction_marker_rate_hz: 5.0
  # A compact record is queued every control cycle. Full horizon matrices are
  # serialized by a background writer at this lower diagnostic rate.
  full_prediction_log_rate_hz: 2.0
  telemetry_queue_size: 512

startup:
  enabled: true
  steering_center_command_rad: 0.0
  steer_settle_time_s: 0.6
  crawl_speed_mps: 0.6
  crawl_delta_max_rad: 0.15
  crawl_delta_rate_max_radps: 1.0
  observer_confidence_threshold: 0.6
  observer_valid_samples_required: 15
  localization_jump_distance_m: 0.50
  localization_jump_yaw_rad: 0.70
  mpcc_ramp_time_s: 0.8
  mpcc_valid_solutions_required: 5
  steering_rate_max_radps: 1.5

fallback:
  single_failure_use_shifted_solution: true
  enter_safe_decel_after_failures: 2
  stop_after_failures: 20
  # A rejected solution near a boundary must shed speed quickly.  The
  # previous 1 m/s^2 ramp left the car moving for about three metres at 3 m/s.
  decel_mps2: 4.0
  # Do not straighten the front wheels while the car is still moving quickly:
  # the last accepted/shifted command is normally the corrective turn that is
  # keeping the vehicle inside the track.  Recenter only after slowing down.
  hold_last_steering_while_decelerating: true
  steering_recenter_below_speed_mps: 0.35
  steering_recenter_rate_radps: 0.75

# A geometrically independent safety candidate. It is evaluated only when the
# MPCC horizon predicts track-boundary risk (or while a previous takeover is
# being held). Both horizons use the same vehicle footprint and track widths.
pure_pursuit_candidate:
  enabled: true
  trigger_track_slack_m: 0.04
  # Used only by the opt-in tiered-risk tracking profile. An already shallow
  # margin bypasses prediction confirmation; model-only risk needs two cycles.
  activation_current_margin_m: 0.02
  prediction_risk_confirmation_cycles: 2
  horizon_s: 1.25
  dt_s: 0.05
  boundary_margin_m: 0.10
  max_speed_mps: 4.0
  # Recovery is temporary and remains slower than normal MPCC.  Keep at least
  # 1.20 m/s (unless an upstream safety cap is lower) so Ackermann steering can
  # generate lateral motion; candidate commands are never fed back recursively.
  recovery_speed_min_mps: 1.20
  recovery_speed_max_mps: 1.50
  recovery_full_slowdown_depth_m: 0.12
  max_steering_rate_radps: 1.5
  lookahead_base_m: 0.35
  lookahead_speed_gain_s: 0.30
  lookahead_lateral_gain: 0.70
  lookahead_min_m: 0.45
  lookahead_max_m: 1.20
  steering_delay_s: 0.08
  lateral_accel_limit_mps2: 2.8
  curvature_preview_m: 1.2
  lateral_error_soft_m: 0.12
  lateral_error_hard_m: 0.42
  heading_error_soft_rad: 0.15
  heading_error_hard_rad: 0.70
  minimum_speed_scale: 0.25
  arbitration:
    enabled: true
    minimum_margin_improvement_m: 0.05
    minimum_candidate_margin_m: 0.02
    # Avoid rejecting a 2 cm margin because of sub-millimetre projection noise.
    minimum_candidate_margin_tolerance_m: 0.001
    # A shallow excursion may be recovered even though stage zero is already
    # outside. It must stop worsening, re-enter promptly, and finish with a
    # meaningful advantage over the rejected MPCC horizon.
    recovery_minimum_initial_margin_m: -0.12
    recovery_maximum_worsening_m: 0.02
    recovery_reentry_time_s: 0.60
    recovery_final_margin_m: 0.05
    recovery_minimum_progress_m: 0.07
    minimum_hold_s: 0.50
    release_mpcc_margin_m: 0.08
    release_safe_cycles: 5

publisher:
  rate_hz: 50.0
  steering_slew_rate_limit_radps: 1.5
  acceleration_limit_mps2: 1.5
  deceleration_limit_mps2: 2.0
  max_dt_s: 0.10
  command_timeout_s: 0.25

frames:
  world: map
  body: localization_base_link

safety:
  # Hardware launch starts by default after its preflight passes. Debug launch
  # still overrides this with start_enabled=false.
  start_enabled: true
  allow_real_command_topic: false
  collision_required: false
  global_speed_max_mps: 4.0
  baseline_speed_max_mps: 4.0
  debug_speed_max_mps: 4.0
  max_consecutive_failures: 20
  emergency_track_slack_m: 0.08
  # Keep 8 cm strict for the first 0.30 s. A later violation requests a
  # lower-speed re-solve instead of immediately counting as solver failure.
  near_track_horizon_s: 0.30
  far_track_slack_hard_m: 0.25
  far_track_retry_speed_scale: 0.80
  far_track_retry_min_speed_mps: 1.20
  predictive_speed_hold_s: 2.0
  predictive_speed_recovery_mps2: 0.50
  dynamic_speed_cap_feasibility_guard: true
  recovery_speed_mps: 0.35
  track_control_margin_m: 0.05
  collision_timeout_s: 0.50
  latency_speed_reduction_start_s: 0.16
  latency_speed_limit_mps: 0.50
  observer_model_only_speed_limit_mps: 1.0
  observer_invalid_speed_limit_mps: 0.35

actuator:
  # Initial, not identified. These values must remain labelled assumed.
  speed_static_gain: 1.0
  speed_time_constant_s: 0.20
  speed_dead_time_s: 0.13
  steering_static_gain: 1.0
  steering_time_constant_s: 0.08
  # Keep this equal to the residual-model training configuration. The separate
  # 0.08 s state still models the measured mechanical steering response.
  steering_dead_time_s: 0.0

cost:
  contour: 18.0
  lag: 40.0
  # Debug/baseline keeps the original heading aid. Race MPCC uses only weak
  # regularization; both references come from the same x/y spline.
  heading_debug: 3.0
  heading_race: 0.5
  sideslip: 8.0
  yaw_rate_tracking: 3.0
  progress_consistency: 4.0
  speed_prior_debug: 5.0
  # Race speed is selected by the online safe envelope and progress reward;
  # the CSV vx column is not an OCP reference.
  speed_prior_race: 0.0
  speed_command: 0.04
  steering_command: 0.15
  virtual_speed: 0.02
  speed_command_rate: 0.20
  steering_command_rate: 0.60
  virtual_speed_rate: 0.05
  progress_reward_debug: 0.0
  progress_reward_race: 1.0
  track_slack_linear: 10000.0
  track_slack_quadratic: 100000.0
  tire_slack_quadratic: 200.0

constraints:
  virtual_speed_max_mps: 6.0
  tire_slip_soft_limit_rad: 0.30

solver:
  backend: acados
  nlp_solver_type: SQP_RTI
  # One initial RTI plus at most one geometry/risk correction per 50 ms tick.
  # More corrections increased deadline jitter without curing infeasible
  # dynamic speed caps.
  rti_iterations: 2
  max_corrective_rti_per_cycle: 1
  rti_min_iterations: 1
  rti_early_stop_track_slack_m: 0.04
  # Do not accept an RTI intermediate iterate whose first command still
  # violates the physical steering-rate constraint.
  rti_early_stop_steer_rate_tolerance_radps: 0.10
  predictive_retry_rti_iterations: 1
  qp_solver: PARTIAL_CONDENSING_HPIPM
  integrator_type: ERK
  hessian_approx: GAUSS_NEWTON
  levenberg_marquardt: 1.0e-4
  # Five 10 ms ERK substeps keep the stiff low-speed lateral mode stable.
  sim_method_num_steps: 5
  hpipm_mode: ROBUST
  print_level: 0

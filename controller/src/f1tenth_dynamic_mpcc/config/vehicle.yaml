  parameter_status: assumed_not_identified
  map_type: linear
  gain: 1.0
  bias: 0.0
  tau: 0.08
  delay: 0.0
  delta_min: -0.55
  delta_max: 0.55

steering_observer:
  enabled: true
  rate_hz: 50.0
  model_only_max_speed_mps: 0.3
  dynamic_correction_min_speed_mps: 1.5

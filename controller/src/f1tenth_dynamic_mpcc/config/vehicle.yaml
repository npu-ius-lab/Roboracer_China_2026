  kinematic_gain_max: 0.15
  dynamic_gain_max: 0.10
  vy_derivative_cutoff_hz: 1.5
  yaw_rate_derivative_cutoff_hz: 1.5
  pseudo_angle_cutoff_hz: 1.5
  innovation_limit_rad: 0.15
  dropout_timeout_s: 0.25
  initial_variance_rad2: 0.04

deployment_limits:
  first_test_command_speed_mps: 2.0
  first_test_speed_slew_mps2: 1.0
  first_test_steer_slew_radps: 3.0
